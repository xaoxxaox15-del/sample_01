<!DOCTYPE html>
<html lang="ja">
<head>

    </header>
    <main>
        <section id="about" class="about">

                    あいうえお<br>

                    あいうえおあいうえお

            </div>
        </section>

        <section id="profile" class="profile bg-yellow">
            <div class="inner">
                <h2 class="section-title">Profile</h2>
                <figure class="profile-box">
                    <img src="img/prof.png" alt="プロフ">
                    <figcaption class="text-box">
                        <h3>Aya アヤ</h3>
                        <hr>
                        <p class="description">
                            東京都内のあいうえお専門学校に通いながら、あいうえおとして修行中の彩です。<br>
                            あいうえおあいうえおあいうえおあいうえおあいうえおあいうえおあいうえおあいう<br>
                            あいうえおあいうえおあいうえおあいうえおあいうえおあいうえおあいうえおあいう
                        </p>
                 </figcaption>
                </figure>
            </div>
        </section>

        <section id="works" class="works">
            <div class="inner">
                <h2 class="section-title">Works</h2>
                <ul class="grid">
                    <li class="grid-item">
                        <figure>
                            <img src="img/tart01.png" alt="あいう">
                            <figcaption>
                                <h3>あいうえお</h3>
                                <p>あいうえおあいうえおあいうえおあいうえお。</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="grid-item">
                        <figure>
                            <img src="img/tart01.png">
                            <figcaption>
                                <h3>かきくけこ</h3>
                                <p>かきくけこかきくけこかきくけこかきくけこ</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="grid-item">
                        <figure>
                            <img src="img/tart01.png" alt="さしす">

                                <p>さしすせそさしすせそすさしすせそ</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="glid-item">
                        <figure>
                            <img src="img/tart01.png" alt="たちつ">
                            <figcaption>
                                <h3>たちつて</h3>
                                <p>たちツテとたっつてと</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="grid-item">
                        <figure>
                            <img src="img/tart01.png" alt="なにぬ">

                    <li class="grid-item">
                        <figure>
                            <img src="img/tart01.png" alt="はひふ">
                            <figcaption>
                                <h3>はひふ</h3>
                                <p>はひふはひふはひふはひふ</p>

                        </figure>
                    </li>
                </ul>
            </div> 

        </section>
<section id="news" class="news bg-yellow">
    <div class="inner">
        <h2 class="section-title">News</h2>
        <ul>
            <li>
                <dl>
                    <dt><time datetime="2026-02-20">2026.02.20</time></dt>
                    <dd>ゆめかわいい試作中！</dd>
                </dl>
            </li>
            <li>
                <dl>
                    <dt><time datetime="2025-12-25">2025.12.25</time></dt>
                    <dd>ゆめかわ作品を２点追加しました！</dd>        
                </dl>
            </li>
            <li>
                <dl>
                    <dt><time datetime="2025-12-23">2025.12.23</time></dt>
                    <dd>insuta開設しました</dd>
                </dl>
            </li>
        </ul>
    </div>
</section>

        <section id="contact" class="contact">
            <div class="inner">
                <h2 class="section-title">Contact</h2>
                <div class="contact-box">
                    <p>お仕事のご相談、コラボのお誘い、または感想などお気軽にご連絡ください。</p>
                    <form action="#" method="post">
                        <div class="flex">
                            <label for="name">お名前</label>
                            <input type="text" id="name" name="name" placeholder="田中たろう">
                        </div>
                        <div class="flex">
                            <label for="kana">ふりがな</label>
                            <input type="text" id="kana" name="kana" placeholder="たなかたろう">
                        </div>
                        <div class="flex">
                            <label for="email">メールアドレス</label>
                            <input type="email" id="email" name="email" placeholder="info@ya">
                        </div>
                        <div class="flex">
                            <label for="message">お問い合わせ</label>
                            <textarea id="message" name="message" rows="6" placeholder="ご用件をご記入"></textarea>
                        </div>
                        <button type="submit">送信</button>
                    </form>
                </div>
            </div>
        </section>
 </main>
